<!DOCTYPE html>
<html lang="pt-BR" class="pl-boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPlanSiS|Flows</title>
<meta name="application-name" content="GPlanSiS|Flows">
<meta name="version" content="2.1.0">
<meta name="description" content="Diagramação estilo Visio com módulo BPM: validação, simulação, execução e auditoria.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f8f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2428" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flows">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="plataforma.css">
<script>window.FLOWS_PLATFORM=1</script>
<style>
:root{
  --bg:#e9ebed; --panel:#f7f8f9; --panel2:#e1e4e7; --line:#c9ced3; --text:#1d2226; --muted:#5f676d;
  --accent:#b86e00; --accent-ink:#ffffff; --accent-soft:rgba(184,110,0,.14);
  --paper:#fdfdfc; --gridc:rgba(40,50,60,.07); --gridm:rgba(40,50,60,.15);
  --sel:#1f6fd1; --selsoft:rgba(31,111,209,.10); --guide:#e0447c;
  --danger:#b3261e; --warn:#9a6a00; --ok:#2e7d32; --info:#1f6fd1;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181b; --panel:#1f2428; --panel2:#2a3035; --line:#384047; --text:#e3e6e8; --muted:#8e979d;
    --accent:#f6a709; --accent-ink:#1a1400; --accent-soft:rgba(246,167,9,.16);
    --paper:#eceeef; --gridc:rgba(40,50,60,.08); --gridm:rgba(40,50,60,.16);
    --sel:#1f6fd1; --selsoft:rgba(31,111,209,.12); --guide:#d6336c;
    --danger:#ff7b6e; --warn:#f6c445; --ok:#6fcf74; --info:#6aaeff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1f2428; --panel2:#2a3035; --line:#384047; --text:#e3e6e8; --muted:#8e979d;
  --accent:#f6a709; --accent-ink:#1a1400; --accent-soft:rgba(246,167,9,.16);
  --paper:#eceeef; --gridc:rgba(40,50,60,.08); --gridm:rgba(40,50,60,.16);
  --sel:#1f6fd1; --selsoft:rgba(31,111,209,.12); --guide:#d6336c;
  --danger:#ff7b6e; --warn:#f6c445; --ok:#6fcf74; --info:#6aaeff;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.35 var(--font);display:grid;grid-template-rows:auto auto 1fr auto;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0}
input[type=color]{padding:1px;width:34px;height:26px}
input[type=checkbox]{accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:42px}
#brand{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
#brand span{color:var(--accent);font-weight:500}
#fname{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw;border:0;background:none;padding:2px 4px;border-radius:4px}
#fname:hover{background:var(--panel2)}
#topbtns{margin-left:auto;display:flex;gap:4px;align-items:center}
.tb{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:30px}
.tb:hover{background:var(--panel2)}
.tb.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb[disabled]{opacity:.45;cursor:default}
@media (max-width:700px){ .tb .lbl{display:none} #fname{max-width:20vw} }

#ribbon{background:var(--panel);border-bottom:1px solid var(--line)}
#tabs{display:flex;gap:2px;padding:0 6px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 11px 6px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
#tools{display:flex;gap:2px;padding:4px 6px 6px;overflow-x:auto;scrollbar-width:thin;min-height:62px;align-items:stretch}
.tool{flex:0 0 auto;border:1px solid transparent;background:none;border-radius:6px;min-width:58px;max-width:84px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text)}
.tool:hover{background:var(--panel2);border-color:var(--line)}
.tool.on{background:var(--accent-soft);border-color:var(--accent)}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.sep{flex:0 0 1px;background:var(--line);margin:4px 4px}
.swatch{flex:0 0 auto;width:74px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:5px;display:flex;flex-direction:column;gap:4px;align-items:stretch;font-size:11px}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch i{display:flex;height:16px;border-radius:3px;overflow:hidden}
.swatch i b{flex:1}

#main{display:grid;grid-template-columns:232px 1fr 292px;min-height:0;position:relative}
#main.nostencil{grid-template-columns:0 1fr 292px}
#main.noprops{grid-template-columns:232px 1fr 0}
#main.nostencil.noprops{grid-template-columns:0 1fr 0}
#stencil,#props{background:var(--panel);min-height:0;overflow:hidden;display:flex;flex-direction:column}
#stencil{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600}
.ph .x{margin-left:auto;border:0;background:none;font-size:18px;line-height:1;padding:2px 6px;color:var(--muted);display:none}
.pb{overflow:auto;flex:1;padding:6px 8px 20px}
#ssearch{width:100%;margin:6px 0}
.cat{border-bottom:1px solid var(--line)}
.cat>button{width:100%;text-align:left;border:0;background:none;padding:7px 2px;font-weight:500;display:flex;align-items:center;gap:6px}
.cat>button::before{content:"";width:0;height:0;border:4px solid transparent;border-left-color:var(--muted);transition:transform .12s}
.cat.open>button::before{transform:rotate(90deg) translateX(2px)}
.cat .grid{display:none;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:3px;padding:2px 0 8px}
.cat.open .grid{display:grid}
.st{border:1px solid transparent;border-radius:5px;background:none;padding:3px 1px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--muted);touch-action:none;user-select:none}
.st:hover{border-color:var(--line);background:var(--panel2);color:var(--text)}
.st.armed{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.st svg{width:40px;height:30px;overflow:visible}
.st{min-width:0}
.st span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stencil .pb{overflow-x:hidden;scrollbar-gutter:stable}

#center{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#cwrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--paper)}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#svg.panning{cursor:grabbing}
#svg.tool-conn{cursor:crosshair}
#svg text{font-family:var(--font)}
#edit{position:absolute;display:none;z-index:6;border:1px solid var(--sel);background:#fff;color:#1d2226;resize:none;padding:4px;text-align:center;font-family:var(--font);line-height:1.2;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#mini{position:absolute;right:10px;bottom:10px;width:180px;height:120px;background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:3;overflow:hidden;opacity:.95}
#mini svg{width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
#mini.off{display:none}
#hint{position:absolute;left:10px;top:10px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;color:var(--muted);display:none;max-width:70%}
#replay{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:none;align-items:center;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,.15);width:min(560px,90%)}
#replay input[type=range]{flex:1;accent-color:var(--accent);padding:0;border:0;background:none}

#console{display:none;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);height:var(--ch,40vh);min-height:140px;max-height:80vh}
#console.open{display:flex}
#cgrip{height:7px;cursor:ns-resize;flex:0 0 auto;touch-action:none;display:flex;justify-content:center;align-items:center}
#cgrip::after{content:"";width:40px;height:3px;border-radius:2px;background:var(--line)}
#ctabs{display:flex;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);align-items:center;overflow-x:auto;scrollbar-width:none}
#ctabs .tab{padding:5px 10px}
#ctabs .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted);padding:2px 8px}
#cbody{flex:1;overflow:auto;padding:10px 12px}

#bottom{display:flex;align-items:center;gap:4px;background:var(--panel);border-top:1px solid var(--line);padding:3px 6px;min-height:32px}
#pages{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:center}
#pages::-webkit-scrollbar{display:none}
.pg{border:1px solid transparent;background:none;border-radius:5px 5px 0 0;padding:4px 10px;white-space:nowrap;color:var(--muted);font-size:12px}
.pg.on{background:var(--paper);color:#1d2226;border-color:var(--line);border-bottom-color:var(--paper);font-weight:500}
.pg .st8{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--line)}
.pg .st8.pub{background:var(--ok)} .pg .st8.rev{background:var(--warn)}
#addpg{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:26px;height:24px;flex:0 0 auto}
#status{font:11.5px var(--mono);color:var(--muted);white-space:nowrap;display:flex;gap:10px;align-items:center}
#zoomsel{font:11.5px var(--mono);padding:1px 4px;height:24px}

/* propriedades */
.sec{border-bottom:1px solid var(--line);padding:8px 2px 10px}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec h4 small{font-weight:400;color:var(--muted)}
.fr{display:grid;grid-template-columns:86px 1fr;gap:4px 6px;align-items:center;margin-bottom:5px}
.fr label{font-size:11.5px;color:var(--muted)}
.fr2{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px}
.fr2 label{font-size:10.5px;color:var(--muted);display:block}
.fr2 input{width:100%}
.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 9px;min-height:28px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.btn.sm{padding:2px 7px;min-height:24px;font-size:12px}
.btn.dng{color:var(--danger)}
textarea{width:100%;resize:vertical}
.small{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr 22px;gap:3px;margin-bottom:3px}
.kv button{border:0;background:none;color:var(--muted);font-size:15px;padding:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor} .chip.warn{color:var(--warn);border-color:currentColor} .chip.err{color:var(--danger);border-color:currentColor} .chip.info{color:var(--info);border-color:currentColor}

/* console */
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 6px;position:sticky;top:0;background:var(--panel)}
table.t td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--panel2)}
.kpis{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0 12px}
.kpis div{flex:1 1 150px;background:var(--panel);padding:7px 10px;box-shadow:inset -1px -1px 0 var(--line)}
.kpis b{display:block;font:500 17px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.kpis span{font-size:11.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}
.card h5{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar{height:9px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.hot{background:var(--danger)}
.issue{display:flex;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.issue:hover{background:var(--panel2)}
.mono{font-family:var(--mono);font-size:11.5px}
.log{font:11.5px/1.45 var(--mono);white-space:pre-wrap;color:var(--muted);max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.prop{font:13px/1.5 var(--font);white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;max-height:200px;overflow:auto}
.gate{border-left:3px solid var(--accent);padding:4px 8px;margin:6px 0;font-size:12px;color:var(--muted)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#mhead{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
#mhead button{margin-left:auto;border:0;background:none;font-size:20px;color:var(--muted)}
#mbody{padding:12px 14px;overflow:auto}
#mfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.menu{position:fixed;z-index:21;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:4px;min-width:220px;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;border:0;background:none;padding:7px 10px;border-radius:5px;text-align:left;gap:8px}
.menu button:hover{background:var(--panel2)}
.menu button kbd{margin-left:auto;color:var(--muted);font:11px var(--mono)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:6px;font-size:12.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

@media (max-width:860px){
  #main,#main.nostencil,#main.noprops,#main.nostencil.noprops{grid-template-columns:1fr}
  #stencil,#props{position:absolute;top:0;bottom:0;z-index:8;width:min(300px,88vw);display:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
  #stencil{left:0} #props{right:0}
  #stencil.mopen,#props.mopen{display:flex}
  .ph .x{display:block}
  #mini{width:120px;height:80px}
  #console{height:var(--ch,52vh)}
}
/* ---- 2.1: celular e PWA ---- */
body{grid-template-columns:minmax(0,1fr)}
#top,#ribbon,#main,#bottom{min-width:0}
#top,#ribbon,#bottom{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#ribbon{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#pages{min-width:0}
#topbtns{min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
#topbtns::-webkit-scrollbar{display:none}
#topbtns>*{flex:0 0 auto}
@media (max-width:860px){
  #stencil,#props{width:min(320px,88vw);padding-bottom:env(safe-area-inset-bottom,0px)}
  #stencil{padding-left:env(safe-area-inset-left,0px)} #props{padding-right:env(safe-area-inset-right,0px)}
  #stencil.mopen,#props.mopen{animation:flDrawer .16s ease-out}
  #props.mopen{animation-name:flDrawerR}
  .ph{min-height:44px}
  #mini{display:none}
}
@keyframes flDrawer{from{transform:translateX(-100%)}to{transform:none}}
@keyframes flDrawerR{from{transform:translateX(100%)}to{transform:none}}
@media (max-width:520px){
  #brand{display:none}
  #top{gap:6px}
  #top{padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  #fname{max-width:none;flex:1 1 auto;min-width:0;text-align:left}
  #topbtns{gap:2px;flex:0 0 auto}
  .tb{padding:0 8px}
  #status #stxt{display:none}
}
@media (max-width:400px){ #fname{display:none} }
@media (pointer:coarse){
  .tb{min-height:40px;min-width:40px;justify-content:center}
  #fname{min-height:40px}
  #plSync{min-height:40px;min-width:40px;justify-content:center;background:none}
  #plMe{min-width:40px;min-height:40px;align-items:center;justify-content:center;margin-left:0}
  .tab{min-height:40px}
  #bottom{min-height:44px}
  .pg{min-height:40px;padding:4px 12px}
  #addpg{width:40px;height:40px}
  #zoomsel{height:40px}
  .ph .x{min-width:40px;min-height:40px}
  .btn{min-height:40px}
  .btn.sm{min-height:36px}
  .menu button{min-height:44px;align-items:center}
  #mhead button,#ctabs .x,#rpClose{min-width:40px;min-height:40px}
  .cat>button{min-height:44px}
  .kv button{min-width:36px;min-height:36px}
  input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),select,textarea:not(#edit){font-size:16px}
  input[type=color]{width:44px;height:36px}
}
@media (max-height:500px) and (pointer:coarse){
  #tools{min-height:0;padding:2px 6px 3px}
  .tool{min-width:44px;min-height:44px;padding:4px;justify-content:center}
  .tool span{display:none}
  #top{min-height:0;padding-top:2px;padding-bottom:2px}
  .tab{padding:5px 11px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header id="top">
  <div id="brand">GPlanSiS<span>|Flows</span></div>
  <button id="fname" title="Renomear documento">Sem título</button>

/* SHA-256 síncrono (trilha de auditoria encadeada) */
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes=new TextEncoder().encode(str);const l=bytes.length;const nb=((l+9+63)>>6)<<6;const m=new Uint8Array(nb);m.set(bytes);m[l]=0x80;
  const bl=l*8;const dv=new DataView(m.buffer);dv.setUint32(nb-4,bl>>>0);dv.setUint32(nb-8,Math.floor(bl/2**32));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Uint32Array(64);
  const ro=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=ro(w[i-15],7)^ro(w[i-15],18)^(w[i-15]>>>3),s1=ro(w[i-2],17)^ro(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
    let[a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=ro(e,6)^ro(e,11)^ro(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=ro(a,2)^ro(a,13)^ro(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])>>>0)}
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}
/* PRNG determinístico */
function mulberry(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

let doc, undoS=[], redoS=[], SEL=new Set(), view={x:0,y:0,z:1};
const OPT={grid:true,snap:true,guides:true,mini:true,heat:false};
function newPage(name){return {id:nid('p'),name:name||'Página-1',shapes:[],conns:[],meta:{owner:'',version:0,status:'Rascunho',desc:'',hist:[]}}}
function newDoc(){return {v:1,name:'Sem título',theme:'gplansis',pages:[newPage('Página-1')],cur:0,res:{},inst:[],audit:[],work:[]}}
const page=()=>doc.pages[doc.cur];
const shapeById=(id,pg)=>(pg||page()).shapes.find(s=>s.id===id);
const connById=(id,pg)=>(pg||page()).conns.find(c=>c.id===id);
const findAny=id=>{for(const p of doc.pages){const s=p.shapes.find(x=>x.id===id);if(s)return{s,p}}return null};
function def(t){return SH[t]||SH.rect}
function kindOf(s,pg){const D=def(s.t);let k=D.k||null;
  if(k==='term'){const inc=(pg||page()).conns.some(c=>c.b.s===s.id&&flowType(c,pg)==='seq');k=inc?'end':'start'}
  if(k==='timer')k='inter';if(k==='link')k=null;return k}
const isActivity=k=>k==='task'||k==='call';
function sty(s){const D=def(s.t),T=TH(),role=T[D.r]||T.gen;const st=s.st||{},d=D.def||{};
  return {f:st.f??d.f??role[0],s:st.s??d.s??role[1],t:st.t??role[2],hd:st.hd??role[3]??role[1],sw:st.sw??d.sw??1.6,dash:st.dash??d.dash??'',fs:st.fs??(D.r==='pool'?13:12),b:st.b||0,i:st.i||0}}
function mkShape(t,x,y,extra){const D=def(t);const s={id:nid('s'),t,x:Math.round(x),y:Math.round(y),w:D.w,h:D.h,txt:extra?.txt??(D.k&&!['pool','note','group','data'].includes(D.k)?'':'' ),st:{},d:{}};
  if(t==='pool'){s.txt='Processo';s.d.lanes=[{id:nid('l'),n:'Raia 1',h:150},{id:nid('l'),n:'Raia 2',h:150}]}

function placeAtCenter(t,extra){const V=vb();return placeShape({t,...(extra||{})},V.x+V.w/2,V.y+V.h/2)}
function addLane(){const p=page().shapes.find(s=>SEL.has(s.id)&&s.t==='pool')||page().shapes.find(s=>s.t==='pool');if(!p)return toast('Insira um pool primeiro');rec();p.d.lanes=p.d.lanes||[];p.d.lanes.push({id:nid('l'),n:'Raia '+(p.d.lanes.length+1),h:140});p.h=p.d.lanes.reduce((a,l)=>a+l.h,0);changed()}
function wrapGroup(){const sh=page().shapes.filter(s=>SEL.has(s.id));if(!sh.length)return placeAtCenter('bgroup');rec();const b=bbox(sh);const g=mkShape('bgroup',b.x-20,b.y-30,{w:b.w+40,h:b.h+50});g.txt='Grupo';page().shapes.unshift(g);SEL.clear();SEL.add(g.id);changed()}

function selShapes(){return page().shapes.filter(s=>SEL.has(s.id))}
function align(k){const sh=selShapes();if(sh.length<2)return toast('Selecione duas ou mais formas');rec();const b=bbox(sh);const ref=sh[0];
  sh.forEach(s=>{if(k==='l')s.x=b.x;if(k==='r')s.x=b.x+b.w-s.w;if(k==='c')s.x=Math.round(ref.x+ref.w/2-s.w/2);if(k==='t')s.y=b.y;if(k==='b')s.y=Math.max(...sh.map(q=>q.y+q.h))-s.h;if(k==='m')s.y=Math.round(ref.y+ref.h/2-s.h/2)});changed()}
function distribute(ax){const sh=selShapes();if(sh.length<3)return toast('Selecione três ou mais formas');rec();const key=ax==='h'?'x':'y',sz=ax==='h'?'w':'h';sh.sort((a,b)=>a[key]-b[key]);
  const first=sh[0],last=sh[sh.length-1];const tot=sh.reduce((a,s)=>a+s[sz],0);const gap=(last[key]+last[sz]-first[key]-tot)/(sh.length-1);let p=first[key];sh.forEach(s=>{s[key]=Math.round(p);p+=s[sz]+gap});changed()}
function sameSize(){const sh=selShapes();if(sh.length<2)return;rec();const r=sh[0];sh.forEach(s=>{if(s.t!=='pool'){s.w=r.w;s.h=r.h}});changed()}
function zorder(d){const pg=page();const sh=pg.shapes.filter(s=>SEL.has(s.id));if(!sh.length)return;rec();pg.shapes=pg.shapes.filter(s=>!SEL.has(s.id));d>0?pg.shapes.push(...sh):pg.shapes.unshift(...sh);changed()}

/* ================= layout automático em camadas ================= */
function layers(nodes,edges){const ids=new Set(nodes.map(n=>n.id));const out={},inc={};nodes.forEach(n=>{out[n.id]=[];inc[n.id]=[]});
  edges.forEach(e=>{if(ids.has(e.a)&&ids.has(e.b)&&e.a!==e.b){out[e.a].push(e.b);inc[e.b].push(e.a)}});
  const state={},back=new Set();const order=[];const roots=nodes.filter(n=>!inc[n.id].length||n.k==='start').map(n=>n.id);
  const dfs=u=>{state[u]=1;for(const v of out[u]){if(state[v]===1)back.add(u+'>'+v);else if(!state[v])dfs(v)}state[u]=2;order.push(u)};
  roots.forEach(r=>{if(!state[r])dfs(r)});nodes.forEach(n=>{if(!state[n.id])dfs(n.id)});
  const L={};order.reverse().forEach(u=>{if(L[u]==null)L[u]=0;for(const v of out[u]){if(back.has(u+'>'+v))continue;L[v]=Math.max(L[v]??0,L[u]+1)}});
  return{L,out,inc,back}}
function autoLayout(dir,quiet){dir=dir||'LR';const pg=page();rec();const fl=s=>{const k=kindOf(s,pg);return k&&!['pool','note','group','data'].includes(k)||(!def(s.t).box&&!['note','group','data'].includes(def(s.t).k)&&def(s.t).r!=='pool')};
  const seq=pg.conns.filter(c=>c.a.s&&c.b.s&&['seq','plain'].includes(flowType(c,pg))).map(c=>({a:c.a.s,b:c.b.s}));
  const assoc=pg.conns.filter(c=>c.a.s&&c.b.s&&flowType(c,pg)==='assoc');
  const attach=(s)=>{const o=[];for(const c of assoc){const other=c.a.s===s.id?c.b.s:c.b.s===s.id?c.a.s:null;if(!other)continue;const q=shapeById(other,pg);if(q&&['data','note'].includes(def(q.t).k))o.push({q,dx:q.x-s.x,dy:q.y-s.y})}return o};
  const pools=pg.shapes.filter(s=>s.t==='pool').sort((a,b)=>a.y-b.y);const used=new Set();
  let py=pools.length?pools[0].y:0,px=pools.length?pools[0].x:0;
  for(const p of pools){const members=pg.shapes.filter(s=>s!==p&&!def(s.t).box&&poolOf(s,pg)===p&&fl(s));members.forEach(m=>used.add(m.id));
    const lanes=p.d.lanes&&p.d.lanes.length?p.d.lanes:[{id:'_',n:p.txt,h:p.h}];const laneIdx=m=>{const l=laneOf(m,pg);return l&&l.lane?Math.max(0,lanes.indexOf(l.lane)):0};
    const memLane={};members.forEach(m=>memLane[m.id]=laneIdx(m));const att={};members.forEach(m=>att[m.id]=attach(m));
    const {L}=layers(members.map(m=>({id:m.id,k:kindOf(m,pg)})),seq);const COLW=170,ROWH=118;
    const cells={};members.sort((a,b)=>(L[a.id]-L[b.id])||(a.y-b.y)).forEach(m=>{const key=L[m.id]+'|'+memLane[m.id];(cells[key]=cells[key]||[]).push(m)});
    const laneRows=lanes.map((_,i)=>Math.max(1,...Object.entries(cells).filter(([k])=>+k.split('|')[1]===i).map(([,v])=>v.length)));
    p.x=px;p.y=py;let y=p.y;lanes.forEach((l,i)=>{l.h=Math.max(140,laneRows[i]*ROWH+30);l._y=y;y+=l.h});p.h=y-p.y;
    const maxL=Math.max(0,...members.map(m=>L[m.id]));p.w=Math.max(p.w<600?600:0,56+40+(maxL+1)*COLW+30);
    for(const [key,list] of Object.entries(cells)){const [li,ln]=key.split('|').map(Number);const l=lanes[ln];const cx=p.x+56+30+li*COLW+COLW/2;
      list.forEach((m,k)=>{const cy=l._y+l.h/2+(k-(list.length-1)/2)*ROWH-(def(m.t).tp==='below'&&m.txt?8:0);m.x=snapV(cx-m.w/2);m.y=snapV(cy-m.h/2);att[m.id].forEach(a=>{a.q.x=m.x+clamp(a.dx,-80,m.w+40);a.q.y=m.y+clamp(a.dy,-90,m.h+60)})})}
    lanes.forEach(l=>delete l._y);if(lanes[0].id==='_')p.h=lanes[0].h;py=p.y+p.h+60}
  const free=pg.shapes.filter(s=>!used.has(s.id)&&!def(s.t).box&&!poolOf(s,pg)&&fl(s));
  if(free.length){const b=bbox(free);const {L}=layers(free.map(m=>({id:m.id,k:kindOf(m,pg)})),seq);const by={};free.sort((a,b)=>a.y-b.y||a.x-b.x).forEach(m=>{(by[L[m.id]]=by[L[m.id]]||[]).push(m)});
    const ox=pools.length?px:b.x,oy=pools.length?py:b.y;const STEP=dir==='LR'?190:130,ROW=dir==='LR'?120:180;const mx=Math.max(...Object.values(by).map(v=>v.length));
    for(const [li,list] of Object.entries(by)){list.forEach((m,k)=>{const off=(k-(list.length-1)/2)*ROW;const att=attach(m);
      if(dir==='LR'){m.x=snapV(ox+li*STEP+80-m.w/2);m.y=snapV(oy+mx*ROW/2+off-m.h/2)}else{m.x=snapV(ox+mx*ROW/2+off-m.w/2);m.y=snapV(oy+li*STEP+50-m.h/2)}
      att.forEach(a=>{a.q.x=m.x+clamp(a.dx,-80,m.w+40);a.q.y=m.y+clamp(a.dy,-90,m.h+60)})})}}
  pg.conns.forEach(c=>{if(c.rt!=='curve')c.rt='ortho'});changed();if(!quiet){fit();toast('Layout automático aplicado')}}

function stencilIcon(it){const D=def(it.t);const s={id:'x',t:it.t,x:0,y:0,w:D.w,h:D.h,txt:'',st:{},d:it.d||{}};if(it.t==='pool')return `<svg viewBox="0 0 48 30"><rect x="1" y="1" width="46" height="28" fill="#fff" stroke="#2d3336"/><path d="M7 1v28M7 15h40" stroke="#2d3336"/></svg>`;

  if(it.t==='text')inner=`<text x="${w/2}" y="${h/2+8}" text-anchor="middle" font-size="24" font-weight="600" fill="#2d3336">Aa</text>`;

  return `<svg viewBox="${-pad} ${-pad} ${w+pad*2} ${h+pad*2}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`}

$('#cats').addEventListener('pointermove',e=>{if(!SDRAG)return;if(!SDRAG.ghost&&Math.hypot(e.clientX-SDRAG.x,e.clientY-SDRAG.y)>6){const g=document.createElement('div');g.style.cssText='position:fixed;z-index:40;pointer-events:none;width:60px;height:46px;opacity:.85;';g.innerHTML=stencilIcon(itemByKey(SDRAG.key));g.firstChild.style.cssText='width:100%;height:100%';document.body.appendChild(g);SDRAG.ghost=g;if(innerWidth<860)closePanels()}
  if(SDRAG.ghost){SDRAG.ghost.style.left=(e.clientX-30)+'px';SDRAG.ghost.style.top=(e.clientY-23)+'px'}});
$('#cats').addEventListener('pointerup',e=>{const D=SDRAG;SDRAG=null;if(!D)return;if(D.ghost){D.ghost.remove();const r=svg.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const w=toW(e);placeShape(itemByKey(D.key),w.x,w.y)}return}
  const it=itemByKey(D.key);if(ARM&&ARM.key===D.key){ARM=null;hint('');renderStencil();return}ARM=it;renderStencil();hint(`Toque no desenho para inserir: ${it.n}  (Esc cancela)`);if(innerWidth<860)closePanels()});
$('#cats').addEventListener('dblclick',e=>{const b=e.target.closest('.st');if(!b)return;ARM=null;hint('');placeAtCenter(itemByKey(b.dataset.key).t,itemByKey(b.dataset.key))});

/* painéis */
function openPanel(id){if(innerWidth<860){closePanels();$('#'+id).classList.add('mopen')}else{$('#main').classList.remove(id==='stencil'?'nostencil':'noprops')}setTimeout(()=>render(),0)}
function togglePanel(id){if(innerWidth<860){const el=$('#'+id);const o=el.classList.contains('mopen');closePanels();if(!o)el.classList.add('mopen');return}$('#main').classList.toggle(id==='stencil'?'nostencil':'noprops');setTimeout(()=>render(),0)}
function closePanels(){$$('.mopen').forEach(x=>x.classList.remove('mopen'))}
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).classList.remove('mopen')));
$('#bStencil').onclick=()=>togglePanel('stencil');$('#bProps').onclick=()=>togglePanel('props');
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;

/* páginas */
function renderPages(){$('#pages').innerHTML=doc.pages.map((p,i)=>{const st=p.meta.status==='Publicado'?'pub':p.meta.status==='Em revisão'?'rev':'';return `<button class="pg${i===doc.cur?' on':''}" data-pi="${i}" title="${esc(p.meta.status)}${p.meta.version?' · v'+p.meta.version:''}"><i class="st8 ${st}"></i>${esc(p.name)}</button>`}).join('');$('#fname').textContent=doc.name}
function gotoPage(i,keepSel){if(i<0||i>=doc.pages.length)return;commitEdit();doc.cur=i;if(!keepSel)SEL.clear();HOV=null;renderPages();fit();refreshProps();if($('#console').classList.contains('open'))renderConsole()}
function addPage(name){rec();const p=newPage(name||('Página-'+(doc.pages.length+1)));doc.pages.push(p);gotoPage(doc.pages.length-1);autosave();return p}
$('#pages').addEventListener('click',e=>{const b=e.target.closest('[data-pi]');if(b)gotoPage(+b.dataset.pi)});
$('#pages').addEventListener('dblclick',e=>{const b=e.target.closest('[data-pi]');if(!b)return;const p=doc.pages[+b.dataset.pi];const n=prompt('Nome da página',p.name);if(n&&n.trim()){p.name=n.trim();renderPages();autosave()}});
$('#pages').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-pi]');if(!b)return;e.preventDefault();const i=+b.dataset.pi;
  openMenu([['Renomear',()=>{const p=doc.pages[i];const n=prompt('Nome da página',p.name);if(n&&n.trim()){p.name=n.trim();renderPages();autosave()}}],['Duplicar',()=>{const p=deep(doc.pages[i]);const map={};p.id=nid('p');p.name+=' (cópia)';p.shapes.forEach(s=>{const n=nid('s');map[s.id]=n;s.id=n});p.conns.forEach(c=>{c.id=nid('c');if(c.a.s)c.a.s=map[c.a.s];if(c.b.s)c.b.s=map[c.b.s]});p.meta={...p.meta,version:0,status:'Rascunho',hist:[]};doc.pages.splice(i+1,0,p);gotoPage(i+1);autosave()}],
   ['Mover para a esquerda',()=>{if(i>0){[doc.pages[i-1],doc.pages[i]]=[doc.pages[i],doc.pages[i-1]];gotoPage(i-1);autosave()}}],['Mover para a direita',()=>{if(i<doc.pages.length-1){[doc.pages[i+1],doc.pages[i]]=[doc.pages[i],doc.pages[i+1]];gotoPage(i+1);autosave()}}],'-',
   ['Excluir página',()=>{if(doc.pages.length<2)return toast('O documento precisa de ao menos uma página');if(!confirm(`Excluir a página "${doc.pages[i].name}" com ${doc.pages[i].shapes.length} formas? Chamadas de outras páginas para ela ficarão sem destino.`))return;doc.pages.splice(i,1);gotoPage(Math.min(i,doc.pages.length-1));autosave()}]],e.clientX,e.clientY-10)});
$('#addpg').onclick=()=>addPage();
$('#fname').onclick=()=>{if(window.PL&&!PL.canModel())return PL.denied();const n=prompt('Nome do documento',doc.name);if(n&&n.trim()){doc.name=n.trim();renderPages();autosave()}};
$('#zoomsel').onchange=e=>{const v=e.target.value;if(v==='fit')fit();else zoomTo(+v/100);e.target.value=''};
function updStatus(){const z=$('#zoomsel');let o=z.querySelector('[data-cur]');if(!o){o=document.createElement('option');o.dataset.cur=1;z.prepend(o)}o.value='';o.textContent=Math.round(view.z*100)+'%';z.value=''}

/* menus e modal */
function openMenu(items,x,y){const m=$('#menu');m.innerHTML=items.map((it,i)=>it==='-'?'<hr>':`<button data-mi="${i}">${esc(it[0])}${it[2]?`<kbd>${esc(it[2])}</kbd>`:''}</button>`).join('');m.classList.add('open');
  const W=m.offsetWidth,H=m.offsetHeight;m.style.left=Math.min(x,innerWidth-W-8)+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-H-8))+'px';m._items=items}
function closeMenu(){$('#menu').classList.remove('open')}
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-mi]');if(!b)return;const it=$('#menu')._items[+b.dataset.mi];closeMenu();it[1]()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#bFile'))closeMenu()});
function openModal(title,html,btns){$('#mtitle').textContent=title;$('#mbody').innerHTML=html;$('#mfoot').innerHTML='';(btns||[{t:'Fechar'}]).forEach(b=>{const el=document.createElement('button');el.className='btn'+(b.cls?' '+b.cls:'');el.textContent=b.t;el.onclick=async()=>{if(b.fn){const r=await b.fn();if(r===false)return}closeModal()};$('#mfoot').appendChild(el)});$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#mclose').onclick=closeModal;$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});
/* ================= painel de propriedades ================= */
const FAMILIES=[['task','task-user','task-svc','task-script','task-send','task-recv','task-manual','task-rule','subproc','callact'],['ev-start','ev-start-msg','ev-start-timer','ev-start-sig'],['ev-timer','ev-msgc','ev-msgt','ev-sig'],['ev-end','ev-end-msg','ev-end-err','ev-end-term'],['gw-xor','gw-and','gw-or','gw-evt'],
 ['fc-proc','fc-predef','fc-manop','fc-io','fc-doc','fc-mdoc','fc-prep','fc-manin','fc-disp'],['rect','rrect','ellipse','diamond','hex','para','tri','star','cross','arrow','callout','sticky','cyl'],['dataobj','datastore']];
const DISTS={fixed:'Fixa',uni:'Uniforme',tri:'Triangular',exp:'Exponencial'};
const defDur=(s)=>{const D=def(s.t);if(D.k==='inter'||D.k==='timer'||s.t==='fc-delay')return{dist:'fixed',a:60};if(D.tk==='user'||D.tk==='manual')return{dist:'tri',a:10,m:20,b:45};if(D.tk==='svc'||D.tk==='script'||D.tk==='rule'||D.tk==='send')return{dist:'fixed',a:1};return{dist:'tri',a:5,m:10,b:20}};
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}const k=ks[ks.length-1];if(v===undefined||(v===''&&ks[0]==='st'))delete a[k];else a[k]=v}
const F=(lbl,inner)=>`<div class="fr"><label>${lbl}</label>${inner}</div>`;
const inp=(p,v,ty,extra)=>`<input data-p="${p}" ${ty==='num'?'type="number" step="any" data-ty="num"':ty==='color'?'type="color"':''} value="${esc(v??'')}" ${extra||''}>`;
const sel=(p,v,opts,extra)=>`<select data-p="${p}" ${extra||''}>${opts.map(([k,n])=>`<option value="${esc(k)}"${String(k)===String(v??'')?' selected':''}>${esc(n)}</option>`).join('')}</select>`;
const chk=(p,v,lbl,extra)=>`<label class="row" style="gap:5px"><input type="checkbox" data-p="${p}" ${v?'checked':''} ${extra||''}> ${esc(lbl)}</label>`;
function ensureRes(n){if(!n)return null;if(!doc.res[n])doc.res[n]={cap:1,cost:60};return doc.res[n]}
function resOf(s,pg){if(s.d.res)return s.d.res;const l=laneOf(s,pg);return l?l.name:'Executor'}
function refreshProps(){const pg=page();const sh=pg.shapes.filter(s=>SEL.has(s.id)),cs=pg.conns.filter(c=>SEL.has(c.id));let o='',t='Página';
  if(sh.length){t=sh.length>1?`${sh.length} formas`:def(sh[0].t).n;o=shapeProps(sh,pg)}else if(cs.length){t=cs.length>1?`${cs.length} conectores`:'Conector';o=connProps(cs,pg)}else o=pageProps(pg);
  $('#ptitle').textContent=t;$('#pbody').innerHTML=o;PREC=false}
function shapeProps(list,pg){const s=list[0],D=def(s.t),S=sty(s),k=kindOf(s,pg);let o='';
  if(list.length===1){o+=`<div class="sec"><h4>Texto</h4><textarea data-p="txt" rows="2">${esc(s.txt||'')}</textarea></div>`;
    const fam=FAMILIES.find(f=>f.includes(s.t));if(fam)o+=`<div class="sec"><h4>Tipo</h4>${sel('_type',s.t,fam.map(x=>[x,def(x).n]),'data-act="type"')}</div>`}
  if(s.t!=='pool'){o+=`<div class="sec"><h4>Formato <button class="btn sm" data-act="resetfmt" style="margin-left:auto">Padrão do tema</button></h4>
    ${F('Preenchimento',`<div class="row">${inp('st.f',S.f==='none'?'#ffffff':S.f,'color')}${chk('_nofill',S.f==='none','sem')}</div>`)}
    ${F('Linha',`<div class="row">${inp('st.s',S.s==='none'?'#000000':S.s,'color')}${inp('st.sw',S.sw,'num','style="width:64px" min="0" max="12"')}</div>`)}
    ${F('Traço',sel('st.dash',S.dash,[['','Contínuo'],['6 4','Tracejado'],['2 3','Pontilhado'],['10 4 2 4','Traço-ponto']]))}
    ${F('Texto',`<div class="row">${inp('st.t',S.t,'color')}${inp('st.fs',S.fs,'num','style="width:56px" min="6" max="72"')}${chk('st.b',S.b,'N')}${chk('st.i',S.i,'I')}</div>`)}
    ${D.tp!=='below'?F('Alinhar',sel('st.al',s.st.al||D.talign||'center',[['center','Centro'],['left','Esquerda'],['right','Direita']])):''}</div>`}
  if(list.length===1){o+=`<div class="sec"><h4>Posição e tamanho</h4><div class="fr2"><div><label>X</label>${inp('x',s.x,'num')}</div><div><label>Y</label>${inp('y',s.y,'num')}</div><div><label>L</label>${inp('w',s.w,'num')}</div><div><label>A</label>${inp('h',s.h,'num')}</div></div>${s.t!=='pool'?F('Rotação °',inp('rot',s.rot||0,'num','step="15"')):''}</div>`}
  if(list.length===1)o+=bpmProps(s,pg,k);
  if(list.length===1&&s.t!=='pool'){const P=s.d.props||[];o+=`<div class="sec"><h4>Dados da forma <small>(Shape Data)</small></h4>${P.map((p,i)=>`<div class="kv"><input data-kv="${i}" data-f="k" value="${esc(p.k)}" placeholder="Campo"><input data-kv="${i}" data-f="v" value="${esc(p.v)}" placeholder="Valor"><button data-act="kvdel" data-i="${i}" title="Remover">×</button></div>`).join('')}<button class="btn sm" data-act="kvadd">+ Campo</button></div>`}
  o+=`<div class="sec row"><button class="btn sm" data-act="dup">Duplicar</button><button class="btn sm" data-act="front">À frente</button><button class="btn sm" data-act="back">Para trás</button><button class="btn sm dng" data-act="del">Excluir</button></div>`;return o}
function durFields(s,path,lbl){const d=getPath(s,path)||defDur(s);const dist=d.dist||'fixed';
  return `${F(lbl||'Duração',sel(path+'.dist',dist,Object.entries(DISTS),'data-re="1"'))}<div class="fr2">${dist==='fixed'?`<div><label>Minutos</label>${inp(path+'.a',d.a,'num','min="0"')}</div>`:dist==='exp'?`<div><label>Média (min)</label>${inp(path+'.a',d.a,'num','min="0"')}</div>`:dist==='uni'?`<div><label>Mín</label>${inp(path+'.a',d.a,'num')}</div><div><label>Máx</label>${inp(path+'.b',d.b,'num')}</div>`:`<div><label>Mín</label>${inp(path+'.a',d.a,'num')}</div><div><label>Moda</label>${inp(path+'.m',d.m,'num')}</div><div><label>Máx</label>${inp(path+'.b',d.b,'num')}</div>`}</div>`}
function bpmProps(s,pg,k){const D=def(s.t);let o='';
  if(s.t==='pool'){const L=s.d.lanes||[];o+=`<div class="sec"><h4>Raias <small>cada raia é um recurso na simulação</small></h4>${L.map((l,i)=>`<div class="kv" style="grid-template-columns:1fr 64px 22px 22px"><input data-lane="${i}" data-f="n" value="${esc(l.n)}"><input data-lane="${i}" data-f="h" type="number" value="${l.h}"><button data-act="laneup" data-i="${i}" title="Subir">↑</button><button data-act="lanedel" data-i="${i}" title="Remover">×</button></div>`).join('')}<button class="btn sm" data-act="laneadd">+ Raia</button></div>`;return o}
  if(!k)return'';o+=`<div class="sec"><h4>Processo <span class="chip info">${esc(({task:'Atividade',call:'Chamada',start:'Evento de início',inter:'Evento intermediário',end:'Evento de fim',xor:'Gateway exclusivo',and:'Gateway paralelo',or:'Gateway inclusivo',evt:'Gateway por evento',data:'Dado',note:'Anotação',group:'Grupo'})[k]||k)}</span></h4>`;
  if(isActivity(k)){const r=resOf(s,pg);const names=[...new Set([...Object.keys(doc.res),r])];
    o+=F('Recurso',sel('d.res',s.d.res||'',[['',`Raia (${laneOf(s,pg)?.name||'Executor'})`],...names.filter(n=>n!==(laneOf(s,pg)?.name)).map(n=>[n,n])],'data-re="1"'));
    if(k==='call'){o+=F('Chama página',sel('d.page',s.d.page||'',[['','— nenhuma (tempo fixo) —'],...doc.pages.filter(p=>p!==pg).map(p=>[p.id,p.name])],'data-re="1"'));if(s.d.page)o+=`<div class="row" style="margin:-2px 0 6px 92px"><button class="btn sm" data-act="gopage">Abrir página chamada</button></div>`}
    if(k!=='call'||!s.d.page)o+=durFields(s,'d.dur');
    o+=F('Custo fixo R$',inp('d.cost',s.d.cost,'num','min="0" placeholder="0"'));
    if(D.tk==='user'||D.tk==='manual'||s.t==='task'||D.c==='flow')o+=F('Formulário',`<textarea data-p="d.fields" rows="2" placeholder="aprovado:bool&#10;valor:number">${esc(s.d.fields||'')}</textarea>`);
    if(D.tk==='svc'){const C=CONNECTORS[s.d.conn]||null;o+=F('Conector',sel('d.conn',s.d.conn||'',[['','— genérico —'],...Object.entries(CONNECTORS).map(([k,c])=>[k,c.n])],'data-re="1" data-act="conn"'))+F('Endpoint',inp('d.ep',s.d.ep||C?.ep||''))+F('Método',inp('d.method',s.d.method||C?.m||''))
      +F('Payload',`<textarea data-p="d.payload" rows="2" placeholder='{"pedido":"{{pedido}}"}'>${esc(s.d.payload||'')}</textarea>`)+F('Saída em',inp('d.out',s.d.out||'','','placeholder="variável"'))
      +F('Resposta simulada',`<textarea data-p="d.mock" rows="2" placeholder='{"status":"ok"}'>${esc(s.d.mock||'')}</textarea>`)
      +(s.d.conn==='ai'?`<div class="gate">Agente de IA: a resposta vira proposta. A instância só avança depois que uma pessoa aprova na Caixa de tarefas.</div>`:'')}
    if(D.tk==='script')o+=F('Script',`<textarea data-p="d.script" rows="3" placeholder="total = valor * 1.1; status = 'ok'">${esc(s.d.script||'')}</textarea>`);
    if(D.tk==='rule')o+=F('Regras',`<textarea data-p="d.rules" rows="3" placeholder="valor > 50000 => alcada = 'diretoria'">${esc(s.d.rules||'')}</textarea>`);
    if(D.tk==='send'||D.tk==='recv')o+=`<p class="small">Ligue com fluxo de mensagem (conector até outro pool) para correlacionar envio e recebimento.</p>`;
    if(D.tk==='recv')o+=durFields(s,'d.wait','Espera se não houver emissor')}
  if(k==='start'){o+=F('Chegadas a cada',`<div class="row">${inp('d.interval',s.d.interval??30,'num','min="0.1" style="width:80px"')}<span class="small">min (exponencial)</span></div>`);o+=F('Variáveis',`<textarea data-p="d.fields" rows="2" placeholder="cliente:text&#10;valor:number">${esc(s.d.fields||'')}</textarea>`)}
  if(k==='inter'){const tr=D.trg;if(tr==='timer'||s.t==='fc-delay')o+=durFields(s,'d.wait','Duração do timer');else if(tr==='msgc')o+=durFields(s,'d.wait','Espera se não houver emissor')}
  if(['xor','or','evt'].includes(k)){const outs=pg.conns.filter(c=>c.a.s===s.id&&flowType(c,pg)==='seq');const sum=outs.reduce((a,c)=>a+(+c.d.prob||0),0);
    o+=`<p class="small">Saídas: probabilidade para simular; condição para executar (ex.: <span class="mono">valor &gt; 50000</span>).</p>`;
    o+=outs.map(c=>{const B=shapeById(c.b.s,pg);return `<div class="card" style="margin-bottom:5px;padding:6px 8px"><div class="small" style="margin-bottom:3px">→ ${esc(B?.txt||def(B?.t).n||'?')}</div><div class="fr2" style="grid-template-columns:1fr 64px"><input data-cid="${c.id}" data-p="txt" value="${esc(c.txt||'')}" placeholder="Rótulo"><input data-cid="${c.id}" data-p="d.prob" data-ty="num" type="number" min="0" max="100" value="${esc(c.d.prob??'')}" placeholder="%"></div><div class="fr2" style="grid-template-columns:1fr auto"><input data-cid="${c.id}" data-p="d.cond" value="${esc(c.d.cond||'')}" placeholder="Condição"><label class="row small"><input type="checkbox" data-cid="${c.id}" data-p="d.def" ${c.d.def?'checked':''}> padrão</label></div></div>`}).join('');
    if(outs.length)o+=`<p class="small">Soma: <b class="${Math.abs(sum-100)>0.5&&k!=='or'?'chip err':'chip ok'}">${fmtN(sum,0)}%</b> ${k==='or'?'(inclusivo: cada saída é sorteada de forma independente)':''}</p>`;else o+=`<p class="small">Sem saídas ainda.</p>`}
  o+='</div>';return o}
function connProps(list,pg){const c=list[0],ft=flowType(c,pg);const A=shapeById(c.a.s,pg),B=shapeById(c.b.s,pg);let o='';
  o+=`<div class="sec"><h4>Conector</h4>${F('Texto',inp('txt',c.txt||'','','data-tg="c"'))}${F('Rota',sel('rt',c.rt||'ortho',[['ortho','Ortogonal'],['line','Reta'],['curve','Curva']],'data-tg="c"'))}
   ${F('Fluxo',sel('ft',c.ft||'auto',[['auto',`Automático (${({seq:'sequência',msg:'mensagem',assoc:'associação',plain:'simples'})[ft]})`],['seq','Sequência'],['msg','Mensagem'],['assoc','Associação'],['plain','Simples']],'data-tg="c" data-re="1"'))}
   ${F('Seta',sel('st.arrow',c.st.arrow||'',[['','Padrão'],['end','Fim'],['both','Ambas'],['none','Nenhuma']],'data-tg="c"'))}
   ${F('Linha',`<div class="row">${inp('st.s',c.st.s||TH().line,'color','data-tg="c"')}${inp('st.sw',c.st.sw||1.5,'num','data-tg="c" style="width:60px" min="0.5" max="8"')}</div>`)}
   ${F('Traço',sel('st.dash',c.st.dash||'',[['','Do tipo de fluxo'],['6 4','Tracejado'],['2 3','Pontilhado']],'data-tg="c"'))}
   <p class="small">${esc(A?(A.txt||def(A.t).n):'ponto livre')} → ${esc(B?(B.txt||def(B.t).n):'ponto livre')}</p></div>`;
  if(ft==='seq'&&A&&['xor','or','evt'].includes(kindOf(A,pg)))o+=`<div class="sec"><h4>Decisão</h4>${F('Probabilidade %',inp('d.prob',c.d.prob??'','num','data-tg="c" min="0" max="100"'))}${F('Condição',inp('d.cond',c.d.cond||'','','data-tg="c" placeholder="aprovado == true"'))}${F('Fluxo padrão',chk('d.def',c.d.def,'usar se nenhuma condição for verdadeira','data-tg="c"'))}</div>`;

  const roots=[];const insts=[];let iid=0,events=0,stuck=0;const mailbox={},waiting={};
  const newInst=(pageId,corr,parent,t,via)=>{const I={id:++iid,page:pageId,corr:corr??iid,parent,t0:t,tokens:0,joins:{},orx:[],visits:0,cost:0,dead:false,via};insts.push(I);return I};
  const rootOf=I=>{let x=I,g=0;while((x.parent||x.root)&&g++<50)x=x.parent?x.parent.inst:x.root;return x};
  const done=(I,t)=>{if(I.dead)return;I.dead=true;I.t1=t;if(I.parent){const {inst,cb}=I.parent;cb(t)}};
  const kill=I=>{I.tokens=0};
  const enter=(I,id,t)=>{if(I.dead)return;const N=nodeById(id);if(!N){I.tokens--;if(I.tokens<=0)done(I,t);return}
    if(++I.visits>4000){I.tokens=0;stuck++;I.dead=true;return}events++;const S=stat(id);S.n++;
    switch(N.k){
      case'start':return emit(I,N,t);
      case'end':{S.done++;sendMsgs(I,N,t);if(N.trg==='term'){I.tokens=0;return done(I,t)}I.tokens--;if(I.tokens<=0)done(I,t);return}
      case'inter':{if(N.trg==='msgt'||N.trg==='sig'){sendMsgs(I,N,t);return emit(I,N,t)}
        if((N.trg==='msgc')&&N.msgIn.length)return waitMsg(I,N,t,tt=>{TR(id,t,tt,true);S.wait+=tt-t;emit(I,N,tt)});
        const d=sampleD(N.s.d.wait||defDur(N.s),R);S.svc+=d;TR(id,t,t+d,false);return push(t+d,()=>emit(I,N,t+d))}
      case'xor':case'evt':{if(N.out.length<=1)return emit(I,N,t);let tot=N.out.reduce((a,o)=>a+(+o.c.d.prob||0),0);let pick=N.out[0];
        if(tot<=0){pick=N.out[Math.floor(R()*N.out.length)]}else{let u=R()*tot;for(const o of N.out){u-=(+o.c.d.prob||0);if(u<=0){pick=o;break}}}return enter(I,pick.to,t)}
      case'and':{if(N.inn.length>1){I.joins[id]=(I.joins[id]||0)+1;if(I.joins[id]<N.inn.length){I.tokens--;return}I.joins[id]=0}return emitAll(I,N,t)}
      case'or':{if(N.inn.length>1){const exp=I.orx.length?I.orx[I.orx.length-1]:N.inn.length;I.joins[id]=(I.joins[id]||0)+1;if(I.joins[id]<exp){I.tokens--;return}I.joins[id]=0;I.orx.pop()}
        if(N.out.length>1){let ch=N.out.filter(o=>R()*100<(o.c.d.prob!=null&&o.c.d.prob!==''?+o.c.d.prob:50));if(!ch.length)ch=[N.out[Math.floor(R()*N.out.length)]];I.orx.push(ch.length);I.tokens+=ch.length-1;for(const o of ch)enter(I,o.to,t);return}return emit(I,N,t)}
      case'call':{const P=N.s.d.page&&pageById(N.s.d.page);if(P){const st=Object.values(M(P)).find(x=>x.k==='start'&&!x.msgIn.length)||Object.values(M(P)).find(x=>x.k==='start');
          if(st){const C=newInst(P.id,I.corr,{inst:I,cb:tt=>{S.svc+=tt-t;TR(id,t,tt,false);afterAct(I,N,tt)}},t,'call');C.tokens=1;return enter(C,st.id,t)}}
        return activity(I,N,t)}
      case'task':{if(N.tk==='recv'&&N.msgIn.length)return waitMsg(I,N,t,tt=>{TR(id,t,tt,true);S.wait+=tt-t;activity(I,N,tt)});if(N.tk==='recv'){const w=sampleD(N.s.d.wait||{dist:'fixed',a:0},R);if(w>0){TR(id,t,t+w,true);S.wait+=w;return push(t+w,()=>activity(I,N,t+w))}}return activity(I,N,t)}
      default:return emit(I,N,t)}};
  const activity=(I,N,t)=>{const rn=resOf(N.s,N.page);const r=resGet(rn);const S=stat(N.id);
    const start=ts=>{upd(r,ts);r.busy++;const d=Math.max(0,sampleD(N.s.d.dur||defDur(N.s),R));const c=d/60*r.cost+(+N.s.d.cost||0);S.wait+=ts-t;S.svc+=d;S.cost+=c;r.waitSum+=ts-t;r.cnt++;r.svc+=d;rootOf(I).cost+=c;
      if(ts>t)TR(N.id,t,ts,true);TR(N.id,ts,ts+d,false);push(ts+d,()=>{upd(r,ts+d);r.busy--;if(r.q.length){const nx=r.q.shift();nx(ts+d)}afterAct(I,N,ts+d)})};
    if(r.busy<r.cap)start(t);else{r.q.push(start);r.qmax=Math.max(r.qmax,r.q.length)}};
  const afterAct=(I,N,t)=>{if(N.tk==='send')sendMsgs(I,N,t);emit(I,N,t)};
  const emit=(I,N,t)=>{if(I.dead)return;if(!N.out.length){I.tokens--;if(I.tokens<=0)done(I,t);return}if(N.out.length===1)return enter(I,N.out[0].to,t);return emitAll(I,N,t)};
  const emitAll=(I,N,t)=>{if(!N.out.length){I.tokens--;if(I.tokens<=0)done(I,t);return}I.tokens+=N.out.length-1;for(const o of N.out)enter(I,o.to,t)};
  const sendMsgs=(I,N,t)=>{for(const m of N.msgOut){const T=nodeById(m.to);if(!T)continue;if(T.k==='start'){const C=newInst(T.page.id,I.corr,null,t,'msg');C.tokens=1;C.root=rootOf(I);enter(C,T.id,t);continue}
      const key=I.corr+'|'+T.id;if(waiting[key]&&waiting[key].length){const cb=waiting[key].shift();cb(t)}else mailbox[key]=(mailbox[key]||0)+1}};
  const waitMsg=(I,N,t,cb)=>{const key=I.corr+'|'+N.id;if(mailbox[key]>0){mailbox[key]--;cb(t)}else(waiting[key]=waiting[key]||[]).push(cb)};
  const M0=M(pg);const starts=Object.values(M0).filter(x=>x.k==='start'&&(!x.msgIn.length));
  if(!starts.length)return{error:'Nenhum evento de início sem mensagem de entrada nesta página. Adicione um início para gerar chegadas.'};
  for(const st of starts){let t=0;const iv=Math.max(.01,+st.s.d.interval||30);for(let i=0;i<opts.n;i++){const tt=t;push(tt,()=>{const I=newInst(pg.id,null,null,tt,'arr');I.start=st.id;I.tokens=1;roots.push(I);enter(I,st.id,tt)});t+=-iv*Math.log(1-R())}}
  let now=0;const LIM=3e6;let k=0;while(heap.length&&k++<LIM){const e=pop();now=e.t;e.fn()}
  for(const r of Object.values(RES))upd(r,now);
  const leads=roots.filter(I=>I.dead&&I.t1!=null&&I.tokens<=0).map(I=>I.t1-I.t0);const unfinished=roots.length-leads.length;
  const costs=roots.map(I=>I.cost);const sorted=[...leads].sort((a,b)=>a-b);const pct=p=>sorted.length?sorted[Math.min(sorted.length-1,Math.floor(p*sorted.length))]:null;
  const nodes={};for(const id in ST){const s=ST[id];nodes[id]={n:s.n,wait:s.n?s.wait/s.n:0,svc:s.n?s.svc/s.n:0,cost:s.n?s.cost/s.n:0,done:s.done}}
  const res=Object.values(RES).map(r=>({n:r.n,cap:r.cap,util:now>0?r.area/(r.cap*now):0,wait:r.cnt?r.waitSum/r.cnt:0,qmax:r.qmax,cnt:r.cnt,cost:r.svc/60*r.cost})).sort((a,b)=>b.util-a.util);
  const touch=[...new Set(insts.map(I=>I.page))];
  return{page:pg.id,n:roots.length,done:leads.length,unfinished,stuck,leads,avg:leads.length?leads.reduce((a,b)=>a+b,0)/leads.length:null,p50:pct(.5),p90:pct(.9),max:sorted[sorted.length-1],
    cost:costs.length?costs.reduce((a,b)=>a+b,0)/costs.length:0,makespan:now,nodes,res,trace,events,touch,seed:opts.seed,at:Date.now(),
    thr:now>0?leads.length/(now/1440):0,valueRatio:null}}

  openModal(`Publicar “${pg.name}” como v${v}`,`<p>A validação não encontrou erros${warn?` (há ${warn} aviso(s))`:''}.</p><div class="gate">Publicar torna esta versão a referência para execução. A decisão é sua: confirme que revisou o modelo.</div><div class="fr"><label>Revisor</label><input id="pubBy" placeholder="Seu nome" value="${esc(window.PL?PL.me().name:'')}" ${window.PL?'readonly':''}></div><div class="fr"><label>Nota</label><input id="pubNote" placeholder="O que mudou nesta versão"></div><p class="small mono">SHA-256 do modelo: ${hash}</p>`,
   [{t:'Cancelar'},{t:'Confirmar publicação',cls:'pri',fn:()=>{const by=$('#pubBy').value.trim();if(!by){toast('Informe quem revisou');return false}rec();pg.meta.version=v;pg.meta.status='Publicado';pg.meta.hist=pg.meta.hist||[];pg.meta.hist.push({v,at:Date.now(),by,note:$('#pubNote').value.trim(),hash});auditLog('modelo.publicado',{page:pg.name,versao:v,revisor:by,hash});refreshProps();renderPages();autosave();toast(`v${v} publicada`)}}])}
/* ================= expressões (sem eval) ================= */
function exprTokens(src){const re=/\s*(?:(\d+(?:[.,]\d+)?)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|([A-Za-z_À-ÿ][\wÀ-ÿ.]*)|(==|!=|>=|<=|&&|\|\||=>|[+\-*/%<>!()=]))/y;const T=[];let m;re.lastIndex=0;src=String(src);
  while(re.lastIndex<src.length){const i=re.lastIndex;m=re.exec(src);if(!m||m.index!==i){if(/^\s*$/.test(src.slice(i)))break;throw new Error('Expressão inválida perto de “'+src.slice(i,i+12)+'”')}
    if(m[1])T.push({t:'n',v:parseFloat(m[1].replace(',','.'))});else if(m[2])T.push({t:'s',v:m[2].slice(1,-1).replace(/\\(.)/g,'$1')});else if(m[3]){const w=m[3];const lw=w.toLowerCase();if(['e','and'].includes(lw))T.push({t:'o',v:'&&'});else if(['ou','or'].includes(lw))T.push({t:'o',v:'||'});else if(['nao','não','not'].includes(lw))T.push({t:'o',v:'!'});else T.push({t:'i',v:w})}else T.push({t:'o',v:m[4]})}return T}
function evalExpr(src,vars){const T=exprTokens(src);let i=0;const peek=()=>T[i],take=()=>T[i++];const isO=v=>T[i]&&T[i].t==='o'&&T[i].v===v;
  const get=n=>{if(n==='true'||n==='verdadeiro')return true;if(n==='false'||n==='falso')return false;if(n==='null'||n==='nulo')return null;return n.split('.').reduce((a,k)=>a==null?undefined:a[k],vars)};
  const prim=()=>{const t=take();if(!t)throw new Error('Expressão incompleta');if(t.t==='n'||t.t==='s')return t.v;if(t.t==='i')return get(t.v);if(t.v==='('){const v=or();if(!isO(')'))throw new Error('Falta “)”');take();return v}throw new Error('Símbolo inesperado “'+t.v+'”')};
  const un=()=>{if(isO('!')){take();return!un()}if(isO('-')){take();return-un()}return prim()};
  const mul=()=>{let v=un();while(isO('*')||isO('/')||isO('%')){const o=take().v,r=un();v=o==='*'?v*r:o==='/'?v/r:v%r}return v};
  const add=()=>{let v=mul();while(isO('+')||isO('-')){const o=take().v,r=mul();v=o==='+'?(typeof v==='string'||typeof r==='string'?String(v??'')+String(r??''):(+v)+(+r)):v-r}return v};
  const cmp=()=>{let v=add();const t=peek();if(t&&t.t==='o'&&['==','!=','>','<','>=','<=','='].includes(t.v)){take();const r=add();switch(t.v){case'=':case'==':return v==r;case'!=':return v!=r;case'>':return v>r;case'<':return v<r;case'>=':return v>=r;case'<=':return v<=r}}return v};
  const and=()=>{let v=cmp();while(isO('&&')){take();const r=cmp();v=v&&r}return v};const or=()=>{let v=and();while(isO('||')){take();const r=and();v=v||r}return v};
  const v=or();if(i<T.length)throw new Error('Sobrou “'+T[i].v+'” na expressão');return v}
function runAssign(line,vars){const m=line.match(/^\s*([A-Za-z_À-ÿ][\wÀ-ÿ]*)\s*=(?!=)\s*(.+)$/);if(!m)throw new Error('Atribuição inválida: '+line);vars[m[1]]=evalExpr(m[2],vars);return m[1]}
function execScript(src,vars){const ch=[];String(src||'').split(/[;\n]/).map(x=>x.trim()).filter(Boolean).forEach(l=>ch.push(runAssign(l,vars)));return ch}
function execRules(src,vars){const ch=[];for(const l of String(src||'').split('\n').map(x=>x.trim()).filter(Boolean)){const [c,a]=l.split('=>');if(a==null){ch.push(runAssign(c,vars));continue}if(evalExpr(c,vars))a.split(';').map(x=>x.trim()).filter(Boolean).forEach(x=>ch.push(runAssign(x,vars)))}return ch}
function parseFields(src){return String(src||'').split(/[\n,]/).map(x=>x.trim()).filter(Boolean).map(f=>{const [n,t]=f.split(':').map(x=>x.trim());const m=(t||'text').match(/^select\((.*)\)$/i);return{n,t:m?'select':(t||'text').toLowerCase(),opts:m?m[1].split('|').map(x=>x.trim()):null}})}

/* ================= trilha de auditoria encadeada ================= */
function auditLog(ev,data){const A=doc.audit;const prev=A.length?A[A.length-1].hash:'0'.repeat(64);const e={seq:A.length+1,at:new Date().toISOString(),ev,data:JSON.parse(JSON.stringify(data||{}))};e.prev=prev;e.hash=sha256(prev+JSON.stringify({seq:e.seq,at:e.at,ev:e.ev,data:e.data}));A.push(e);if(A.length>5000)A.splice(0,A.length-5000);autosave();return e}
function verifyAudit(){const A=doc.audit;let prev=A.length?A[0].prev:'';for(let i=0;i<A.length;i++){const e=A[i];if(i&&e.prev!==A[i-1].hash)return{ok:false,at:e.seq,why:'elo quebrado (prev não confere)'};const h=sha256(e.prev+JSON.stringify({seq:e.seq,at:e.at,ev:e.ev,data:e.data}));if(h!==e.hash)return{ok:false,at:e.seq,why:'conteúdo alterado (hash não confere)'}}return{ok:true,n:A.length}}

/* ================= motor de execução ================= */
const EX={sel:null,who:(()=>{try{return localStorage.getItem('gplansis-flows-who')||''}catch(e){return''}})()};
function nodeAny(id){for(const p of doc.pages){const s=p.shapes.find(x=>x.id===id);if(s){const m=model(p);return m[id]?{...m[id]}:null}}return null}
const instById=id=>doc.inst.find(i=>i.id===id);
function iLog(I,node,ev,extra){extra=extra?deep(extra):{};const N=nodeAny(node);I.hist.push({node,page:N?.page.id,ev,at:Date.now(),...extra});auditLog('exec.'+ev,{inst:I.no,node:N?(N.s.txt||def(N.s.t).n):node,...(extra||{})})}
function startInstance(pageId,startId,vars,corr,parent){const P=pageById(pageId);const no=(doc.inst.reduce((a,i)=>Math.max(a,i.no||0),0))+1;
  const I={id:nid('i'),no,page:pageId,pname:P?.name||'?',status:'ativa',vars:deep(vars||{}),tokens:[],hist:[],joins:{},orx:[],parent:parent||null,corr:corr||null,created:Date.now()};I.corr=I.corr||I.id;
  doc.inst.unshift(I);const tk={id:nid('t'),node:startId,page:pageId,since:Date.now()};I.tokens.push(tk);iLog(I,startId,'inicio',{vars:I.vars});runInst(I);return I}
function runInst(I){let guard=0;let progressed=true;while(progressed&&guard++<400&&I.status==='ativa'){progressed=false;for(const tk of [...I.tokens]){if(tk.wait||!I.tokens.includes(tk))continue;stepTok(I,tk);progressed=true}}
  if(I.status==='ativa'&&!I.tokens.length)completeInst(I);autosave()}
function outsOf(N){return N.out.map(o=>o.to)}
function moveTok(I,tk,to){const N=nodeAny(to);tk.node=to;tk.page=N?.page.id||tk.page;tk.since=Date.now();delete tk.wait;iLog(I,to,'chegou')}
function forward(I,tk,N){const outs=outsOf(N);if(!outs.length){I.tokens=I.tokens.filter(t=>t!==tk);return}if(outs.length===1)return moveTok(I,tk,outs[0]);
  I.tokens=I.tokens.filter(t=>t!==tk);for(const o of outs){const n={id:nid('t'),node:o,page:tk.page,since:Date.now()};I.tokens.push(n);iLog(I,o,'chegou')}}
function mkWork(I,tk,N,kind,extra){tk.wait=kind;const w={id:nid('w'),inst:I.id,no:I.no,token:tk.id,node:N.id,page:N.page.id,kind,title:N.s.txt||def(N.s.t).n,proc:N.page.name,lane:N.lane?.name||'',created:Date.now(),done:false,...(extra||{})};doc.work.unshift(w);iLog(I,N.id,'aguarda.'+kind);return w}
function stepTok(I,tk){const N=nodeAny(tk.node);if(!N){tk.wait='erro';I.status='erro';iLog(I,tk.node,'erro',{motivo:'nó removido do modelo'});return}
  try{switch(N.k){
    case'start':return forward(I,tk,N);
    case'end':{deliverMsgs(I,N);I.tokens=I.tokens.filter(t=>t!==tk);if(N.trg==='term'){I.tokens=[];cancelWork(I)}if(N.trg==='err'){I.status='erro';iLog(I,N.id,'fim.erro');cancelWork(I);I.tokens=[];I.ended=Date.now();return}iLog(I,N.id,'fim');return}
    case'inter':{if(N.trg==='msgt'||N.trg==='sig'){deliverMsgs(I,N);return forward(I,tk,N)}
      if(N.trg==='msgc'){if(takeMail(I,N))return forward(I,tk,N);if(N.msgIn.length){tk.wait='msg';iLog(I,N.id,'aguarda.msg');return}return void mkWork(I,tk,N,'msg')}
      const d=N.s.d.wait||defDur(N.s);return void mkWork(I,tk,N,'timer',{dur:d.a})}
    case'xor':case'or':case'evt':{const outs=N.out;if(outs.length<=1)return forward(I,tk,N);
      if(N.k!=='evt'){const ok=outs.filter(o=>o.c.d.cond&&evalExpr(o.c.d.cond,I.vars));const df=outs.find(o=>o.c.d.def);
        if(N.k==='xor'&&ok.length){iLog(I,N.id,'decisao.auto',{via:ok[0].c.txt||ok[0].c.d.cond});return moveTok(I,tk,ok[0].to)}
        if(N.k==='or'&&ok.length){iLog(I,N.id,'decisao.auto',{via:ok.map(o=>o.c.txt||o.c.d.cond).join(', ')});I.tokens=I.tokens.filter(t=>t!==tk);I.orx.push(ok.length);ok.forEach(o=>{I.tokens.push({id:nid('t'),node:o.to,page:tk.page,since:Date.now()});iLog(I,o.to,'chegou')});return}
        if(df&&outs.some(o=>o.c.d.cond)){iLog(I,N.id,'decisao.padrao');return moveTok(I,tk,df.to)}}
      if(N.inn.length>1&&N.k==='or'){}
      return void mkWork(I,tk,N,'decision',{multi:N.k==='or',opts:outs.map(o=>{const B=nodeAny(o.to);return{to:o.to,lbl:o.c.txt||(B?(B.s.txt||def(B.s.t).n):'?')}})})}
    case'and':{if(N.inn.length>1){I.joins[N.id]=(I.joins[N.id]||0)+1;if(I.joins[N.id]<N.inn.length){I.tokens=I.tokens.filter(t=>t!==tk);iLog(I,N.id,'juncao.parcial',{n:I.joins[N.id],de:N.inn.length});return}I.joins[N.id]=0}return forward(I,tk,N)}
    case'call':{const P=N.s.d.page&&pageById(N.s.d.page);if(P){const M=model(P);const st=Object.values(M).find(x=>x.k==='start'&&!x.msgIn.length)||Object.values(M).find(x=>x.k==='start');
        if(st){tk.wait='call';const C=startInstance(P.id,st.id,I.vars,I.corr,{inst:I.id,token:tk.id});tk.child=C.id;iLog(I,N.id,'chamou',{filha:C.no,pagina:P.name});return}}
      return void mkWork(I,tk,N,'user',{fields:parseFields(N.s.d.fields)})}
    case'task':{const t=N.tk;
      if(t==='svc'){if(N.s.d.conn==='ai'){const w=mkWork(I,tk,N,'ai',{proposal:null});genProposal(I,N,w);return}const r=callConnector(I,N);iLog(I,N.id,'conector',r);return forward(I,tk,N)}
      if(t==='script'){const ch=execScript(N.s.d.script,I.vars);iLog(I,N.id,'script',{alterou:ch});return forward(I,tk,N)}
      if(t==='rule'){const ch=execRules(N.s.d.rules,I.vars);iLog(I,N.id,'regra',{alterou:ch,vars:pick(I.vars,ch)});return forward(I,tk,N)}
      if(t==='send'){deliverMsgs(I,N);return forward(I,tk,N)}
      if(t==='recv'){if(takeMail(I,N))return forward(I,tk,N);if(N.msgIn.length){tk.wait='msg';iLog(I,N.id,'aguarda.msg');return}return void mkWork(I,tk,N,'msg')}
      return void mkWork(I,tk,N,'user',{fields:parseFields(N.s.d.fields)})}
    default:return forward(I,tk,N)}}
  catch(err){tk.wait='erro';I.status='erro';iLog(I,N.id,'erro',{motivo:err.message})}}
const pick=(o,ks)=>{const r={};(ks||[]).forEach(k=>r[k]=o[k]);return r};
function cancelWork(I){doc.work.forEach(w=>{if(w.inst===I.id&&!w.done){w.done=true;w.cancel=true}})}
function completeInst(I){if(I.status!=='ativa')return;I.status='concluída';I.ended=Date.now();iLog(I,I.hist[I.hist.length-1]?.node,'concluida');
  if(I.parent){const P=instById(I.parent.inst);if(P){const tk=P.tokens.find(t=>t.id===I.parent.token);Object.assign(P.vars,I.vars);if(tk){const N=nodeAny(tk.node);delete tk.wait;delete tk.child;iLog(P,tk.node,'retorno',{filha:I.no});if(N)forward(P,tk,N)}runInst(P)}}}
function mailKey(I,N){return I.corr+'|'+N.id}
function takeMail(I,N){doc.mail=doc.mail||{};const k=mailKey(I,N);if(doc.mail[k]&&doc.mail[k].length){const m=doc.mail[k].shift();Object.assign(I.vars,m.vars||{});iLog(I,N.id,'msg.recebida',{de:m.from});return true}return false}
function deliverMsgs(I,N){doc.mail=doc.mail||{};for(const m of N.msgOut){const T=nodeAny(m.to);if(!T)continue;const lbl=m.c.txt||'mensagem';
    if(T.k==='start'){iLog(I,N.id,'msg.enviada',{para:T.s.txt||'início',msg:lbl});startInstance(T.page.id,T.id,I.vars,I.corr,null);continue}
    let delivered=false;for(const J of doc.inst){if(J.status!=='ativa'||J.corr!==I.corr)continue;const tk=J.tokens.find(t=>t.node===T.id&&t.wait==='msg');if(tk){Object.assign(J.vars,I.vars);delete tk.wait;iLog(J,T.id,'msg.recebida',{de:N.s.txt||'emissor',msg:lbl});forward(J,tk,T);runInst(J);delivered=true;break}}
    if(!delivered){const k=I.corr+'|'+T.id;(doc.mail[k]=doc.mail[k]||[]).push({from:N.s.txt||'',vars:deep(I.vars),at:Date.now()});iLog(I,N.id,'msg.enviada',{para:T.s.txt||'?',msg:lbl,fila:true})}}}
function tmpl(s,vars){return String(s||'').replace(/\{\{\s*([\w.]+)\s*\}\}/g,(_,k)=>{const v=k.split('.').reduce((a,x)=>a==null?a:a[x],vars);return v==null?'':typeof v==='object'?JSON.stringify(v):String(v)})}
function callConnector(I,N){const d=N.s.d;const C=CONNECTORS[d.conn]||{n:'Genérico'};const req={conector:C.n,metodo:d.method||C.m||'POST',endpoint:d.ep||C.ep||'',payload:tmpl(d.payload||'',I.vars)};
  let resp;try{resp=d.mock?JSON.parse(tmpl(d.mock,I.vars)):null}catch(e){resp={erro:'resposta simulada não é JSON válido'}}
  if(!resp){const R=mulberry(I.no*7919+N.id.length);resp={status:'ok',id:(d.conn||'svc').toUpperCase()+'-'+String(Math.floor(R()*9e5+1e5)),em:new Date().toISOString()}}
  const out=d.out||('resp_'+(d.conn||'servico'));I.vars[out]=resp;return{...req,resposta:resp,simulado:true,saida:out}}
async function genProposal(I,N,w){const ctx=`Tarefa: ${N.s.txt}\nProcesso: ${N.page.name}\nVariáveis da instância: ${JSON.stringify(I.vars).slice(0,1500)}\nPayload: ${tmpl(N.s.d.payload||'',I.vars)}`;
  if(SAMPLE){try{const r=await SAMPLE(`Você é um agente de apoio dentro de um processo BPM industrial. Proponha, em português do Brasil e em no máximo 6 linhas, a ação recomendada para a tarefa abaixo, com a justificativa e um risco a verificar. Não decida: uma pessoa vai aprovar ou rejeitar.\n\n${ctx}`,{modelTier:'quick'});w.proposal=r.text.trim();w.src='Claude'}catch(e){w.proposal=mockProposal(I,N);w.src='simulada (IA indisponível: '+(e.code||e.message)+')'}}
  else{w.proposal=mockProposal(I,N);w.src='simulada (IA indisponível nesta visualização)'}
  autosave();if($('#console').classList.contains('open')&&(CT==='inbox'))renderConsole()}
function mockProposal(I,N){const v=I.vars;return `Proposta para “${N.s.txt}”: seguir com a configuração padrão${v.valor?` para o pedido de R$ ${fmtN(+v.valor,2)}`:''}, conferir lista de materiais contra o estoque antes de liberar e registrar a revisão no histórico. Risco: itens com prazo de compra acima de 30 dias.`}
function completeWork(w,vals){const I=instById(w.inst);if(!I||w.done)return;const tk=I.tokens.find(t=>t.id===w.token);if(!tk){w.done=true;return}const N=nodeAny(w.node);if(!N)return;
  const who=EX.who||'anônimo';w.done=true;w.by=who;w.at=Date.now();
  if(w.kind==='user'){Object.assign(I.vars,vals||{});w.result=vals;iLog(I,N.id,'humano.concluiu',{por:who,dados:vals});delete tk.wait;forward(I,tk,N)}
  else if(w.kind==='decision'){const ch=vals.choice;w.result=ch;iLog(I,N.id,'humano.decidiu',{por:who,caminho:ch.map(c=>w.opts.find(o=>o.to===c)?.lbl)});delete tk.wait;
    if(ch.length===1)moveTok(I,tk,ch[0]);else{I.tokens=I.tokens.filter(t=>t!==tk);I.orx.push(ch.length);ch.forEach(c=>{I.tokens.push({id:nid('t'),node:c,page:tk.page,since:Date.now()});iLog(I,c,'chegou')})}}
  else if(w.kind==='ai'){const ok=!!vals.ok;const out=N.s.d.out||'proposta_ia';I.vars[out]={aprovada:ok,texto:w.proposal,nota:vals.note||'',fonte:w.src};I.vars.aprovado_ia=ok;w.result={ok,note:vals.note};iLog(I,N.id,ok?'humano.aprovou_ia':'humano.rejeitou_ia',{por:who,nota:vals.note||''});delete tk.wait;forward(I,tk,N)}
  else{iLog(I,N.id,w.kind==='timer'?'timer.avancado':'msg.registrada',{por:who});delete tk.wait;forward(I,tk,N)}
  runInst(I)}

function startablePages(){return doc.pages.map(p=>({p,st:Object.values(model(p)).filter(x=>x.k==='start'&&!x.msgIn.length)})).filter(x=>x.st.length)}

function buildSpec(pg,spec){const ids={};const pools=spec.pools||[{name:spec.pool||'Processo',lanes:spec.lanes||[],nodes:spec.nodes||[],edges:spec.edges||[]}];let y=0;
  for(const P of pools){const lanes=(P.lanes&&P.lanes.length?P.lanes:[P.name]).map(n=>({id:nid('l'),n:String(n),h:150}));const pool=mkShape('pool',0,y,{w:900,h:lanes.length*150});pool.txt=P.name;pool.d.lanes=lanes;pg.shapes.unshift(pool);
    (P.nodes||[]).forEach((n,i)=>{const t=TMAP[n.type]||SH[n.type]&&n.type||'task';const li=Math.max(0,lanes.findIndex(l=>l.n===n.lane));const D=def(t);const ly=y+lanes.slice(0,li).reduce((a,l)=>a+l.h,0)+75;
      const s=mkShape(t,100+i*20,ly-D.h/2);s.txt=n.label||n.txt||'';
      if(n.connector&&CONNECTORS[n.connector]){s.d.conn=n.connector;s.d.ep=CONNECTORS[n.connector].ep;s.d.method=CONNECTORS[n.connector].m}
      if(n.minutes!=null)s.d.dur={dist:'tri',a:Math.max(0,+n.minutes*.6),m:+n.minutes,b:+n.minutes*1.8};if(n.dur)s.d.dur=n.dur;if(n.wait)s.d.wait=n.wait;

      pg.shapes.push(s);ids[n.id]=s.id});
    (P.edges||[]).forEach(e=>{if(!ids[e.from]||!ids[e.to])return;const c=mkConn({s:ids[e.from]},{s:ids[e.to]});c.txt=e.label||'';if(e.prob!=null&&e.prob!=='')c.d.prob=+e.prob;if(e.cond)c.d.cond=e.cond;if(e.def)c.d.def=true;pg.conns.push(c)});
    y+=lanes.length*150+60;lanes.forEach(l=>ensureRes(l.n))}
